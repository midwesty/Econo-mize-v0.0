<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fleet & Fortune v0.1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="initGame()">

    <!-- Top HUD -->
    <header id="top-bar">
        <div class="hud-item" id="hud-weather">Weather: --</div>
        <div class="hud-item" id="hud-credits">Credits: 0</div>
        <div class="hud-item" id="hud-time">Date: --</div>
    </header>

    <!-- Main Game Container -->
    <div id="game-wrapper">
        
        <!-- Sidebar Menu -->
        <aside id="sidebar">
            <h2>Fleet & Fortune</h2>
            <button onclick="togglePanel('map')">🗺️ Map</button>
            <button onclick="togglePanel('missions')">📜 Missions</button>
            <button onclick="togglePanel('transport')">🚚 Transport</button>
            <button onclick="togglePanel('staff')">🧍 Staff</button>
            <button onclick="togglePanel('services')">🛠️ Services</button>
            <button onclick="togglePanel('log')">📖 Log</button>
        </aside>

        <!-- Main View Panels -->
        <main id="main-display">

            <section id="map-panel" class="panel active">
                <h3>World Map</h3>
                <img src="https://via.placeholder.com/800x400?text=MAP+PLACEHOLDER" alt="Map Placeholder" class="placeholder-img">
            </section>

            <section id="missions-panel" class="panel">
                <h3>Available Missions</h3>
                <div id="mission-list"></div>
            </section>

            <section id="transport-panel" class="panel">
                <h3>Transport Options</h3>
                <div id="transport-list"></div>
            </section>

            <section id="staff-panel" class="panel">
                <h3>Available Staff</h3>
                <div id="staff-list"></div>
            </section>

            <section id="services-panel" class="panel">
                <h3>Town Services</h3>
                <div id="services-list"></div>
            </section>

            <section id="log-panel" class="panel">
                <h3>Mission Log</h3>
                <div id="log-box"></div>
            </section>

        </main>
    </div>

    <!-- Bottom Notification Bar -->
    <footer id="bottom-bar">
        <span id="notif-msg">Welcome to Fleet & Fortune.</span>
    </footer>

    <!-- JS -->
    <script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fleet Baron (Demo)</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- =========================================================
       TOP NAV / HUD
  ========================================================== -->
  <header id="topNav">
    <div id="appTitle">Fleet Baron</div>

    <div class="navGroup">
      <button id="btnWorld" class="btn">World Map</button>
      <button id="btnTown" class="btn">Town Map</button>
    </div>

    <div class="navGroup hud">
      <div id="timeDisplay" class="hudItem">Day 1 08:00</div>
      <div id="weatherDisplay" class="hudItem">Weather: clear</div>
    </div>

    <div class="navGroup right">
      <button id="btnSave" class="btn">Save</button>
      <button id="btnLoad" class="btn">Load</button>
      <button id="btnReset" class="btn danger">Reset</button>
    </div>
  </header>

  <!-- =========================================================
       MAIN LAYOUT
  ========================================================== -->
  <main id="layout">
    <!-- =======================
         MAP / MAIN VIEW
    ======================== -->
    <section id="mainView">
      <!-- WORLD VIEW -->
      <div id="worldView" class="mapView">
        <div class="mapFrame">
          <!-- Background image -->
          <img
            id="worldMapImg"
            class="mapImg"
            src="assets/map.png"
            alt="World Map"
            draggable="false"
          />
          <!-- Markers layer -->
          <div id="worldMarkers" class="markerLayer" aria-label="World markers"></div>
        </div>
      </div>

      <!-- TOWN VIEW -->
      <div id="townView" class="mapView" style="display:none;">
        <div class="mapFrame">
          <!-- Background image -->
          <img
            id="townMapImg"
            class="mapImg"
            src="assets/town.png"
            alt="Town Map"
            draggable="false"
          />
          <!-- Markers layer -->
          <div id="townMarkers" class="markerLayer" aria-label="Town markers"></div>
        </div>
      </div>
    </section>

    <!-- =======================
         RIGHT SIDEBAR
    ======================== -->
    <aside id="rightSidebar">
      <div id="tabs">
        <button id="tabBtn_log" class="tabBtn">Log</button>
        <button id="tabBtn_missions" class="tabBtn">Missions</button>
        <button id="tabBtn_staff" class="tabBtn">Staff</button>
        <button id="tabBtn_investments" class="tabBtn">Investments</button>
      </div>

      <div id="tabPanels">
        <div id="tabPanel_log" class="tabPanel"></div>
        <div id="tabPanel_missions" class="tabPanel" style="display:none;"></div>
        <div id="tabPanel_staff" class="tabPanel" style="display:none;"></div>
        <div id="tabPanel_investments" class="tabPanel" style="display:none;"></div>
      </div>
    </aside>
  </main>

  <!-- =========================================================
       BOTTOM BAR
  ========================================================== -->
  <footer id="bottomBar">
    <div id="moneyDisplay">Money: 500 c</div>
    <div id="incomeDisplay">Staff Salaries: 0 c/day • Investments: 0 • Active Missions: 0</div>
    <div id="alertsDisplay" aria-live="polite"></div>
  </footer>

  <!-- =========================================================
       MODAL ROOT (game.js injects overlays here)
  ========================================================== -->
  <div id="modalRoot" aria-live="polite"></div>

  <!-- =========================================================
       TUTORIAL OVERLAY (game.js controls visibility)
  ========================================================== -->
  <div id="tutorialOverlay" class="hidden"></div>

  <!-- =========================================================
       SCRIPT
  ========================================================== -->
  <script src="game.js"></script>
</body>
</html>
